<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FINEXT Lender Portal</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="styles.css?v=38" />
</head>
<body class="signed-out">
  <div class="shell">
    <!-- Signed in: FINEXT on the left, the bank and the signed-in staff member on the right. Hidden on the sign-in pages. -->
    <header class="topbar" aria-label="Lender portal">
      <div class="topbar-inner">
        <a class="brand" href="#/" aria-label="FINEXT Lender Portal home">
          <span class="brand-mark"><img src="assets/feather.png" alt="" /></span>
          <span class="wordmark"><b>Fi</b><span>next</span></span><span class="product">Lender Portal</span>
        </a>
        <div id="partner"></div>
        <div id="account" class="account"></div>
      </div>
    </header>
    <div class="workspace">
      <main id="app" class="container" aria-live="polite">
        <!-- Shown until the portal has started: replaced by the sign-in page or the applicants. -->
        <div class="splash" aria-label="Loading"><img src="assets/feather.png" alt="" /></div>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script type="module" src="app.js?v=39"></script>
</body>
</html>
